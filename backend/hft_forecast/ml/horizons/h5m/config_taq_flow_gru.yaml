# h5m trial 7 (T7), deep learning 2: T6 plus the raw 20-minute history of each stock
# (feature set h5m_seq: 6 raw L1 variables x 20 lags), read by a GRU (models/h5m_gru.py).
# The engineered features (basic + h30s_flow) still enter through a dense branch, so
# T7 - T6 = what a sequence model finds in the raw history beyond the engineered features.
# Same rows as T4-T6 (basic already needs 30 bars of warm-up, more than the 20 lags).
experiment: h5m
name: h5m taq h5m_gru basic+flow+seq20 lag1
horizon:
  name: h5m
  seconds: 300
  grid: 1min
data:
  source: wrds_taq
  dataset: taq_nbbo_bars
  instruments: [AAPL, ABBV, ABT, ACN, ADBE, AMD, AMGN, AMZN, AVGO, BAC, COST, CRM, CSCO, CVX,
                DHR, DIS, GOOG, HD, INTC, INTU, JNJ, JPM, KO, LIN, LLY, MA, MCD, META, MRK, MS,
                MSFT, NFLX, NVDA, ORCL, PEP, PFE, PG, QCOM, TMO, TMUS, TSLA, UNH, V, VZ, WFC,
                WMT, XOM]
  start: 2024-01-02
  end: 2024-06-28     # 124 sessions: 40 train + 10 test, 8 walk-forward folds
  frequency: 1min
features:
  - name: basic
    params:
      vol_windows: [15, 30]
  - name: h30s_flow          # from the h30s group (Junyang); windows re-set for 1-minute bars
    params:
      ofi_windows: [1, 5, 15, 30]        # order-flow imbalance summed over 1, 5, 15, 30 minutes
      imbalance_windows: [5, 15, 30]     # mean queue imbalance over 5, 15, 30 minutes
      imbalance_changes: [1, 5]          # change of the queue imbalance over 1 and 5 minutes
      regime_window: 30                  # one-tick share and quote intensity over 30 minutes
  - name: h5m_seq            # raw history for the GRU
    params:
      length: 20                         # the last 20 minutes, newest = lag 0
labels:
  dead_zone_bps: 3.0
  drop_stale_targets: true
  warmup_seconds: 60
  cooldown_seconds: 60
  start_lag_bars: 1
cv:
  train_sessions: 40
  test_sessions: 10
  anchored: false
  purge: true
  min_train_rows: 20000
model:
  name: h5m_gru              # GRU(32) over the sequence + dense(64) over the rest, same heads
seed: 42
tags: [taq, real-data, lag1, flow, seq, gru]
