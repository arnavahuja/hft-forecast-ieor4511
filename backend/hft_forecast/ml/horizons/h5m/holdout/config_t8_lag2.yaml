# HOLDOUT copy, generated by scripts/make_holdout_configs.py. Do not edit by hand.
# h5m trial 8 (T8): config_taq_flow_mlp.yaml with label lag 2. Generated by scripts/make_t8_config.py.
# h5m trial 6 (T6), deep learning 1: identical to config_taq_flow.yaml (T4) except the model,
# a small MLP (models/h5m_mlp.py) with default parameters, untuned by design. Same dataset as
# T4 and T5, so T6 is compared with the linear model (T4) and the trees (T5) on equal terms.
experiment: h5m_holdout
name: h5m taq h5m_mlp basic+flow lag2 (T8) [holdout 2024H2]
horizon:
  name: h5m
  seconds: 300
  grid: 1min
data:
  source: wrds_taq
  dataset: taq_nbbo_bars
  instruments: [AAPL, ABBV, ABT, ACN, ADBE, AMD, AMGN, AMZN, AVGO, BAC, COST, CRM, CSCO, CVX,
                DHR, DIS, GOOG, HD, INTC, INTU, JNJ, JPM, KO, LIN, LLY, MA, MCD, META, MRK, MS,
                MSFT, NFLX, NVDA, ORCL, PEP, PFE, PG, QCOM, TMO, TMUS, TSLA, UNH, V, VZ, WFC,
                WMT, XOM]
  start: 2024-07-01
  end: 2024-12-31     # holdout: 2024H2, run once
  frequency: 1min
features:
  - name: basic
    params:
      vol_windows: [15, 30]
  - name: h30s_flow          # from the h30s group (Junyang); windows re-set for 1-minute bars
    params:
      ofi_windows: [1, 5, 15, 30]        # order-flow imbalance summed over 1, 5, 15, 30 minutes
      imbalance_windows: [5, 15, 30]     # mean queue imbalance over 5, 15, 30 minutes
      imbalance_changes: [1, 5]          # change of the queue imbalance over 1 and 5 minutes
      regime_window: 30                  # one-tick share and quote intensity over 30 minutes
labels:
  dead_zone_bps: 3.0
  drop_stale_targets: true
  warmup_seconds: 60
  cooldown_seconds: 60
  start_lag_bars: 2      # T8: the only change from the source
cv:
  train_sessions: 40
  test_sessions: 10
  anchored: false
  purge: true
  min_train_rows: 20000
model:
  name: h5m_mlp              # 2 hidden layers (64, 32), direction + return heads, early stopping
seed: 42
tags: [taq, real-data, lag2, flow, mlp, t8, holdout]