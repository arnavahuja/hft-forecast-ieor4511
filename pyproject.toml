[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-forecast-ieor4511"
version = "0.1.0"
description = "Short-horizon price forecasting on TAQ quote data (IEOR 4511 capstone)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24",
    "exchange_calendars>=4.5",
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "typer>=0.12",
    "PyYAML>=6",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "pandas-stubs",
    "types-PyYAML",
    "empyrical-reloaded>=0.5",
]

[project.scripts]
hftf = "hft_forecast.cli:main"

[project.entry-points."hft_forecast.plugins"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
hft_forecast = ["py.typed", "templates/*.tmpl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL", "D"]
ignore = [
    "D105", "D107", "D203", "D213",
    "PLR0913",  # plugin constructors and engines legitimately take many collaborators
    "PLR2004",  # enforced by review; numeric literals in tests are fine
    "RUF012",
    "PLC0415",  # lazy imports: heavy optional libs (yfinance, wrds) and registry<->interfaces
    "PLR0917",  # engine/context signatures mirror the domain; keyword use is encouraged
    "N812",     # `from hft_forecast.core import columns as C` is the project-wide convention
    "UP046",    # explicit Generic[T] kept for readability of the registry
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "PLC0415", "PLR0911"]
"user_plugins/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["hft_forecast"]
plugins = ["pydantic.mypy"]
# NumPy's stubs type most reductions (sum, mean, ...) as returning Any, which would force a
# cast on nearly every numerical return. We keep every other --strict check.
warn_return_any = false

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "yfinance.*", "wrds.*", "scipy.*", "statsmodels.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the network or WRDS; opt-in with -m live",
    "slow: slow tests",
]
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]

[tool.coverage.run]
source = ["hft_forecast"]
omit = ["backend/hft_forecast/data/sources/wrds_*.py"]

[tool.importlinter]
root_package = "hft_forecast"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "hft_forecast.api",
    "hft_forecast.services",
    "hft_forecast.ml",
    "hft_forecast.analytics",
    "hft_forecast.engine",
    "hft_forecast.data",
    "hft_forecast.core",
]
ignore_imports = [
    # plugin packages live inside layers but may only use core; checked by the next contract
]

[[tool.importlinter.contracts]]
name = "Core depends on nothing"
type = "forbidden"
source_modules = ["hft_forecast.core"]
forbidden_modules = [
    "hft_forecast.data", "hft_forecast.engine", "hft_forecast.analytics", "hft_forecast.portfolio",
    "hft_forecast.strategies", "hft_forecast.services", "hft_forecast.api",
    "hft_forecast.ml",
]

[[tool.importlinter.contracts]]
name = "Plugins depend only on core"
type = "forbidden"
source_modules = [
    "hft_forecast.strategies",
    "hft_forecast.portfolio",
    "hft_forecast.data.sources",
    "hft_forecast.engine.costs",
    "hft_forecast.engine.fills",
    "hft_forecast.analytics.metrics",
    "hft_forecast.analytics.charts",
    "hft_forecast.ml.models",
    "hft_forecast.ml.features",
]
forbidden_modules = ["hft_forecast.api", "hft_forecast.services"]

[[tool.importlinter.contracts]]
name = "Strategies are independent of other plugins"
type = "forbidden"
source_modules = ["hft_forecast.strategies"]
forbidden_modules = [
    "hft_forecast.portfolio", "hft_forecast.data.sources", "hft_forecast.engine",
    "hft_forecast.analytics", "hft_forecast.ml",
]

[[tool.importlinter.contracts]]
# A model gets arrays in and arrays out. This is what lets three groups add models in
# parallel without touching shared training or evaluation code.
name = "ML plugins depend only on core and ml.base"
type = "forbidden"
source_modules = ["hft_forecast.ml.models", "hft_forecast.ml.features"]
forbidden_modules = [
    "hft_forecast.engine", "hft_forecast.analytics", "hft_forecast.data",
    "hft_forecast.ml.train", "hft_forecast.ml.evaluate", "hft_forecast.ml.economic",
    "hft_forecast.ml.cv", "hft_forecast.ml.labels", "hft_forecast.ml.datasets",
]

[[tool.importlinter.contracts]]
name = "Horizon packages are independent"
type = "independence"
modules = [
    "hft_forecast.ml.horizons.h30s",
    "hft_forecast.ml.horizons.h5m",
    "hft_forecast.ml.horizons.h30m",
]
